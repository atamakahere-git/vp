name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: checks
      run: cargo clippy -D warnings --verbose
    - name: fmt
      run: cargo fmt --check
    - name: Run build
      run: cargo b --verbose
